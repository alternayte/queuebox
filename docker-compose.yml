services:
  queuebox:
    build: .
    ports:
      - "8080:8080"
    volumes:
      # F-076: the configuration lives outside the build tree. A change needs a restart, not a
      # rebuild.
      - ./examples/queuebox.yml:/etc/queuebox/queuebox.yml:ro
    # F-073: the database credentials come from the env file, so `--env-file .env.example` is the
    # thing that configures the instance. Without it the start fails with a message that names
    # the variables to set.
    env_file:
      - .env.example
    environment:
      # F-074: the application reads only the QUEUEBOX_ prefixed variables. This one names the
      # mount above, so it belongs to the stack, not to the operator.
      - QUEUEBOX_CONFIG_FILE=/etc/queuebox/queuebox.yml
    depends_on:
      postgres:
        condition: service_healthy
      receiver:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: queuebox
      POSTGRES_USER: queuebox
      POSTGRES_PASSWORD: queuebox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queuebox"]
      interval: 5s
      timeout: 5s
      retries: 5

  receiver:
    # The destination of the quick start. It answers 200 and prints the body, so a first run ends
    # with a delivered message and not only with an accepted one. Node ships in the base image.
    image: node:22
    command:
      - node
      - -e
      - |
        require("http").createServer((req, res) => {
          let body = "";
          req.on("data", (chunk) => { body += chunk; });
          req.on("end", () => {
            console.log("delivered " + req.method + " " + req.url + " " + body);
            res.writeHead(200, { "Content-Type": "application/json" });
            res.end("{\"received\":true}");
          });
        }).listen(8080, () => console.log("receiver listening on 8080"));

  # Optional: for testing RabbitMQ integration
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - rabbitmq

volumes:
  postgres_data:
