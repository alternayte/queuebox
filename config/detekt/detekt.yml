# F-066: the detekt configuration of QueueBox. It builds on the default rule set.
# Every entry below states why the project differs from the default.

build:
  # A finding must fail the build, so the tolerance is zero.
  maxIssues: 0

complexity:
  LongParameterList:
    # A constructor of a service takes its collaborators. Six is the practical floor here.
    functionThreshold: 8
    constructorThreshold: 10
  TooManyFunctions:
    # A test class groups many small test functions.
    # The metrics collector holds one delegation function per metric, so the count grows with
    # the metric set and not with the complexity of the class.
    excludes: ['**/test/**']
    thresholdInClasses: 24
    thresholdInFiles: 24
    thresholdInObjects: 24
  LongMethod:
    excludes: ['**/test/**']
  CyclomaticComplexMethod:
    excludes: ['**/test/**']
  NestedBlockDepth:
    excludes: ['**/test/**']

exceptions:
  # Both rules are off for the whole codebase, and the reason is measured, not assumed.
  # With the rules on, 26 sites in 15 main source files report, across every module. QueueBox
  # is a message relay. Every boundary handler must survive any failure of one message and turn
  # it into a retry, a dead letter or a degraded health state. A narrow catch at such a
  # boundary would let an unnamed exception kill the poller. The broad catch is the design.
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

naming:
  InvalidPackageDeclaration:
    # The module source roots do not mirror the package. A file at `src/main/kotlin/App.kt`
    # declares `package org.nxtspec`. A move of every file is a layout change, not a lint change.
    active: false
  FunctionNaming:
    # A test name is a sentence in backticks.
    excludes: ['**/test/**']
  TopLevelPropertyNaming:
    excludes: ['**/test/**']

style:
  WildcardImport:
    # The Ktor routing DSL and the Exposed SQL DSL are designed around a wildcard import.
    # `.editorconfig` disables the matching ktlint rule for the same reason.
    active: false
  MagicNumber:
    excludes: ['**/test/**', '**/build.gradle.kts']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
  MaxLineLength:
    maxLineLength: 120
    excludes: ['**/test/**']
  ReturnCount:
    max: 4
  ThrowsCount:
    max: 4
  ForbiddenComment:
    # The build must fail on a TODO left in the shipped code.
    comments:
      - reason: 'A TODO must become a tracked finding, not a comment.'
        value: 'TODO:'
      - reason: 'A FIXME must become a tracked finding, not a comment.'
        value: 'FIXME:'
  UnusedPrivateMember:
    active: true
  LoopWithTooManyJumpStatements:
    active: false
