server:
  httpPort: 8080

database:
  url: jdbc:postgresql://localhost:5432/queuebox?password=url-password-VALUE
  username: postgres
  password: db-password-VALUE

destinations:
  oauth-api:
    type: http
    baseUrl: https://api.example.com
    path: /webhooks
    auth:
      type: oauth2
      clientId: client-1
      clientSecret: oauth-secret-VALUE
      tokenUrl: https://auth.example.com/token
  basic-api:
    type: http
    baseUrl: https://basic.example.com
    path: /hook
    auth:
      type: basic
      username: user-1
      password: basic-password-VALUE
  header-api:
    type: http
    baseUrl: https://header.example.com
    path: /hook
    headers:
      Authorization: Bearer static-header-VALUE
      X-Api-Key: static-apikey-VALUE
      X-Trace: keep-this
    auth:
      type: header
      headerName: X-Token
      headerValue: header-token-VALUE
  events-exchange:
    type: rabbitmq
    url: amqp://broker-user:broker-password-VALUE@rabbit.example.com:5672
    exchange: events

routes:
  - topicPattern: "order.*"
    destination: oauth-api

sources:
  queue-source:
    type: rabbitmq
    queueName: incoming
    connectionUrl: amqp://queue-user:queue-password-VALUE@rabbit.example.com:5672
    topic: "{{ source }}"
  bearer-source:
    type: http
    path: /bearer
    idempotencyKeyPath: $.id
    eventTypePath: $.type
    auth:
      type: bearer
      token: bearer-token-VALUE
  apikey-source:
    type: http
    path: /apikey
    idempotencyKeyPath: $.id
    eventTypePath: $.type
    auth:
      type: api-key
      headerName: X-API-Key
      key: api-key-VALUE
  hmac-source:
    type: http
    path: /hmac
    idempotencyKeyPath: $.id
    eventTypePath: $.type
    auth:
      type: hmac
      secret: hmac-secret-VALUE
      headerName: X-Signature
