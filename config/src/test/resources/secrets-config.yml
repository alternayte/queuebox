server:
  httpPort: 8080

database:
  url: jdbc:postgresql://localhost:5432/queuebox
  username: postgres
  password: db-password-VALUE

destinations:
  oauth-api:
    type: http
    baseUrl: https://api.example.com
    path: /webhooks
    auth:
      type: oauth2
      clientId: client-1
      clientSecret: oauth-secret-VALUE
      tokenUrl: https://auth.example.com/token
  basic-api:
    type: http
    baseUrl: https://basic.example.com
    path: /hook
    auth:
      type: basic
      username: user-1
      password: basic-password-VALUE
  header-api:
    type: http
    baseUrl: https://header.example.com
    path: /hook
    auth:
      type: header
      headerName: X-Token
      headerValue: header-token-VALUE

routes:
  - topicPattern: "order.*"
    destination: oauth-api

sources:
  bearer-source:
    type: http
    path: /bearer
    idempotencyKeyPath: $.id
    eventTypePath: $.type
    auth:
      type: bearer
      token: bearer-token-VALUE
  apikey-source:
    type: http
    path: /apikey
    idempotencyKeyPath: $.id
    eventTypePath: $.type
    auth:
      type: api-key
      headerName: X-API-Key
      key: api-key-VALUE
  hmac-source:
    type: http
    path: /hmac
    idempotencyKeyPath: $.id
    eventTypePath: $.type
    auth:
      type: hmac
      secret: hmac-secret-VALUE
      headerName: X-Signature
