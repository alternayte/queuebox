# The packaged QueueBox configuration.
#
# QueueBox reads this file ONLY when no external file exists AND no QUEUEBOX_ variable is set.
# See docs/configuration.md. A deployment writes /etc/queuebox/queuebox.yml instead, or names
# another path with QUEUEBOX_CONFIG_FILE, or configures QueueBox with the QUEUEBOX_ variables.
#
# Every value below is a plain default for a local run, and the sources, destinations and routes
# below are a demonstration. A deployment that sets any QUEUEBOX_ variable inherits none of them,
# so it never serves an inbox endpoint that its own configuration does not declare.

server:
  httpPort: 8080

database:
  url: jdbc:postgresql://localhost:5432/queuebox
  username: queuebox
  password: queuebox
  poolSize: 10
  connectionTimeoutMs: 30000

outbox:
  pollIntervalMs: 100
  batchSize: 100
  retryBaseDelayMs: 1000
  maxAttempts: 5

inbox:
  basePath: /inbox

destinations:
  webhook-api:
    type: http
    baseUrl: https://api.example.com
    path: /webhook
    timeoutMs: 30000
    headers:
      Authorization: Bearer ${WEBHOOK_API_TOKEN:-}

  events-exchange:
    type: rabbitmq
    url: amqp://localhost:5672
    exchange: queuebox-events
    exchangeType: topic

routes:
  - topicPattern: "order.*"
    destination: webhook-api

  - topicPattern: "event.**"
    destination: events-exchange
    routingKeyTemplate: "{{ topic }}"

sources:
  stripe:
    path: /stripe
    idempotencyKeyPath: $.id
    eventTypePath: $.type

  github:
    path: /github
    idempotencyKeyPath: $.delivery
    eventTypePath: $.action
