# The QueueBox configuration that docker-compose.yml mounts at /etc/queuebox/queuebox.yml.
#
# This file lives outside the build tree on purpose. See finding F-076 in hardening-doc.md.
# A change here needs a container restart, not a rebuild.
#
# An environment variable that starts with QUEUEBOX_ wins over any value in this file.

server:
  httpPort: 8080

database:
  poolSize: 10
  connectionTimeoutMs: 30000

outbox:
  pollIntervalMs: 100
  batchSize: 100
  retryBaseDelayMs: 1000
  maxAttempts: 5

inbox:
  basePath: /inbox

destinations:
  # The quick start delivers here. `docker-compose.yml` runs the `receiver` service, so a first
  # run ends with a delivered message, not only with an accepted one.
  webhook-api:
    type: http
    baseUrl: http://receiver:8080
    path: /webhook
    timeoutMs: 30000

  # The RabbitMQ half of the quick start. `docker compose --profile rabbitmq up -d` starts the
  # broker. Without the profile the broker is absent, and a message on this route retries.
  events-exchange:
    type: rabbitmq
    url: amqp://guest:guest@rabbitmq:5672
    exchange: queuebox-events
    exchangeType: topic

routes:
  # The `stripe` source writes the event type as the topic, so `payment.succeeded` matches here.
  - topicPattern: "payment.*"
    destination: webhook-api

  - topicPattern: "order.*"
    destination: webhook-api

  - topicPattern: "event.**"
    destination: events-exchange
    routingKeyTemplate: "{{ topic }}"

sources:
  stripe:
    path: /stripe
    idempotencyKeyPath: $.id
    eventTypePath: $.type

  github:
    path: /github
    idempotencyKeyPath: $.delivery
    eventTypePath: $.action
