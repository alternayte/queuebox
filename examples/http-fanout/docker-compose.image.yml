# The HTTP fan-out example on the published image. No checkout and no build.
#
# Download this file and the configuration beside it, then start the stack:
#
#   curl -O https://raw.githubusercontent.com/alternayte/queuebox/main/examples/http-fanout/docker-compose.image.yml
#   curl -O https://raw.githubusercontent.com/alternayte/queuebox/main/examples/http-fanout/queuebox.yml
#   docker compose -f docker-compose.image.yml up -d
#
# `docker-compose.yml` beside this file builds the image from the source tree instead. A
# contributor uses that file, and `smoke-test.sh` runs it.
#
# The mount below names `./queuebox.yml`, so that file must exist before the first start. Docker
# creates a directory for a bind mount whose source is absent, and QueueBox then fails to read its
# configuration.
#
# The image tag is pinned. The registry moves on its own, so a release updates the tag here; see
# docs/development/releasing.md.
services:
  queuebox:
    image: ghcr.io/alternayte/queuebox:0.9.0
    ports:
      - "${QUEUEBOX_PORT:-18081}:8080"
    volumes:
      - ./queuebox.yml:/etc/queuebox/queuebox.yml:ro
    environment:
      - QUEUEBOX_DATABASE_URL=jdbc:postgresql://postgres:5432/queuebox
      - QUEUEBOX_DATABASE_USERNAME=queuebox
      - QUEUEBOX_DATABASE_PASSWORD=queuebox
      - QUEUEBOX_CONFIG_FILE=/etc/queuebox/queuebox.yml
    depends_on:
      postgres:
        condition: service_healthy
      analytics:
        condition: service_started
      audit:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: queuebox
      POSTGRES_USER: queuebox
      POSTGRES_PASSWORD: queuebox
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queuebox"]
      interval: 5s
      timeout: 5s
      retries: 10

  analytics:
    # A destination of the fan-out. It answers 200 and prints the body, so the log proves the
    # delivery. Node ships in the base image, so the example pulls nothing else.
    image: node:22
    command:
      - node
      - -e
      - |
        require("http").createServer((req, res) => {
          let body = "";
          req.on("data", (chunk) => { body += chunk; });
          req.on("end", () => {
            console.log("delivered " + req.method + " " + req.url + " " + body);
            res.writeHead(200, { "Content-Type": "application/json" });
            res.end("{\"received\":true}");
          });
        }).listen(8080, () => console.log("analytics listening on 8080"));

  audit:
    # A destination of the fan-out. It answers 200 and prints the body, so the log proves the
    # delivery. Node ships in the base image, so the example pulls nothing else.
    image: node:22
    command:
      - node
      - -e
      - |
        require("http").createServer((req, res) => {
          let body = "";
          req.on("data", (chunk) => { body += chunk; });
          req.on("end", () => {
            console.log("delivered " + req.method + " " + req.url + " " + body);
            res.writeHead(200, { "Content-Type": "application/json" });
            res.end("{\"received\":true}");
          });
        }).listen(8080, () => console.log("audit listening on 8080"));
