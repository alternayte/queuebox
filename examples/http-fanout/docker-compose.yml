# F-081: the HTTP fan-out example.
#
# A route matches ONE destination, so fan-out means one outbox row per destination. The producer
# writes one message per destination topic. Each row carries its own retries and its own
# dead-letter state, so a failure at one destination never blocks the other.
services:
  queuebox:
    build:
      context: ../..
    ports:
      - "${QUEUEBOX_PORT:-18081}:8080"
    volumes:
      - ./queuebox.yml:/etc/queuebox/queuebox.yml:ro
    environment:
      - QUEUEBOX_DATABASE_URL=jdbc:postgresql://postgres:5432/queuebox
      - QUEUEBOX_DATABASE_USERNAME=queuebox
      - QUEUEBOX_DATABASE_PASSWORD=queuebox
      - QUEUEBOX_CONFIG_FILE=/etc/queuebox/queuebox.yml
    depends_on:
      postgres:
        condition: service_healthy
      analytics:
        condition: service_started
      audit:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: queuebox
      POSTGRES_USER: queuebox
      POSTGRES_PASSWORD: queuebox
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queuebox"]
      interval: 5s
      timeout: 5s
      retries: 10

  analytics:
    # A destination of the fan-out. It answers 200 and prints the body, so the log proves the
    # delivery. Node ships in the base image, so the example pulls nothing else.
    image: node:22
    command:
      - node
      - -e
      - |
        require("http").createServer((req, res) => {
          let body = "";
          req.on("data", (chunk) => { body += chunk; });
          req.on("end", () => {
            console.log("delivered " + req.method + " " + req.url + " " + body);
            res.writeHead(200, { "Content-Type": "application/json" });
            res.end("{\"received\":true}");
          });
        }).listen(8080, () => console.log("analytics listening on 8080"));

  audit:
    # A destination of the fan-out. It answers 200 and prints the body, so the log proves the
    # delivery. Node ships in the base image, so the example pulls nothing else.
    image: node:22
    command:
      - node
      - -e
      - |
        require("http").createServer((req, res) => {
          let body = "";
          req.on("data", (chunk) => { body += chunk; });
          req.on("end", () => {
            console.log("delivered " + req.method + " " + req.url + " " + body);
            res.writeHead(200, { "Content-Type": "application/json" });
            res.end("{\"received\":true}");
          });
        }).listen(8080, () => console.log("audit listening on 8080"));
