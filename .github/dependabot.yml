# F-043: keep the dependencies and the workflow actions current.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
      ktor:
        patterns:
          - "io.ktor*"
      testing:
        patterns:
          - "org.testcontainers*"
          - "io.mockk*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # A major version of the build image is a Gradle major, and the wrapper decides the Gradle
    # version. A major version of the runtime image is a Java major, and F-042 keeps Java 21.
    # Both move on purpose, with the wrapper or the toolchain, and never as a digest bump.
    ignore:
      - dependency-name: gradle
        update-types: ["version-update:semver-major"]
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
