# F-059: continuous integration. Every push and every pull request runs these jobs.
# F-062: the matrix enforces the supported Java range. QueueBox supports Java 21 only.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The full matrix runs nightly as well, so a leg that a pull request skips still runs every
  # day against the default branch.
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  # A new push to the same branch cancels the previous run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Gradle daemon adds no value in a fresh runner.
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: Build on Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # F-062: 21 is the supported release. The build target is Java 21 bytecode.
        # The build also runs on 22 and 23 to prove that a newer JDK compiles the code.
        # A pull request builds on the shipped toolchain only. The image ships Java 21, so 22 and
        # 23 prove forward compatibility, which is a nightly and main-branch concern.
        java: ${{ github.event_name == 'pull_request' && fromJSON('["21"]') || fromJSON('["21","22","23"]') }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # The version comes from the Git tag, so the build needs the tags.
          fetch-depth: 0

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble the project
        # `-x test` keeps the container tests in the test job, which holds the database matrix.
        run: ./gradlew build -x test

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the checks
        # The Ubuntu runner provides the Docker daemon that Testcontainers needs. This job runs
        # the WHOLE suite once, on the default image of each database, and it carries the
        # aggregated coverage gate as well as the per-module gate. See the sixth review gate,
        # defect B3: the aggregate rules existed and nothing ran them.
        #
        # The suite used to run once per matrix entry, which put five copies of it on five
        # two-core runners at the same time. Different unrelated tests then failed in each job,
        # including tests that touch no database, because the runners ran out of room rather than
        # because the code was wrong. The version compatibility that the matrix exists to prove
        # needs the repository tests of one dialect, not the whole suite, so the `compatibility`
        # job below runs those and this job runs everything once.
        run: ./gradlew check jacocoAggregatedReport

      - name: Upload the coverage report
        # The report helps a reviewer even when the checks fail.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/reports/jacoco/aggregated
          if-no-files-found: warn

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/build/reports/tests/test"
          if-no-files-found: warn

  compatibility:
    name: ${{ matrix.database }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    # The `test` job above already covers the newest version of each database, because those are
    # the default images. This job covers the OLDER versions that README.md advertises. Do NOT
    # reduce it to one database: several defects of the hardening effort appeared in one dialect
    # only. A pull request skips it, and a push to main and the nightly schedule run it.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: postgres
            version: "14"
            image_env: TESTCONTAINERS_POSTGRES_IMAGE
            image: postgres:14
            module: postgres
          - database: postgres
            version: "15"
            image_env: TESTCONTAINERS_POSTGRES_IMAGE
            image: postgres:15
            module: postgres
          - database: sqlserver
            version: "2019"
            image_env: TESTCONTAINERS_SQLSERVER_IMAGE
            image: mcr.microsoft.com/mssql/server:2019-latest
            module: sqlserver
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the repository tests of this version
        # The module test task holds the migration, the claim fence, the repository contract and
        # the pull lease suite of one dialect. That is what a supported version must prove.
        env:
          MATRIX_IMAGE_ENV: ${{ matrix.image_env }}
          MATRIX_IMAGE: ${{ matrix.image }}
          MATRIX_MODULE: ${{ matrix.module }}
        run: |
          export "${MATRIX_IMAGE_ENV}=${MATRIX_IMAGE}"
          ./gradlew ":${MATRIX_MODULE}:test"

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.database }}-${{ matrix.version }}
          path: "${{ matrix.module }}/build/reports/tests/test"
          if-no-files-found: warn

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # F-066: ktlint and detekt gate every change. The convention plugin in buildSrc applies
    # both, so the job covers every module.
    continue-on-error: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run ktlint and detekt
        run: ./gradlew ktlintCheck detekt

      - name: Upload the lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: "**/build/reports/detekt"
          if-no-files-found: warn

  docker:
    name: Docker image
    # F-059 asks for an image build and a Trivy scan. The Trivy scan stays in
    # `.github/workflows/security.yml`, which already scans the image and the bill of
    # materials on every pull request. A second scan here would double the runtime and
    # report the same findings twice, so this job proves only that the image builds and
    # starts.
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        # The pull request build stays on one architecture, because the release workflow holds
        # the multi-architecture build. `load` puts the image into the local daemon.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: queuebox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the image
        # A build that produces an image which cannot start is not a passing build.
        run: docker run --rm --entrypoint java queuebox:ci -version

  compose:
    name: Compose quick start
    runs-on: ubuntu-latest
    # F-073 and F-074: the documented quick start must start a working instance. The job runs the
    # exact commands that docs/getting-started.md gives a new user.
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start the stack
        # `-f docker-compose.yml` selects the shipped stack. The override file holds the
        # development loop, which mounts the source tree and rebuilds on a change. The rabbitmq
        # profile starts the broker, so this one job proves both destination kinds.
        run: |
          docker compose -f docker-compose.yml --profile rabbitmq --env-file .env.example \
            up -d --build

      - name: Wait for the instance to become healthy
        run: |
          for attempt in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || true)
            if [ "$status" = "200" ]; then
              echo "healthy after $attempt attempts"
              exit 0
            fi
            sleep 2
          done
          echo "the instance never became healthy"
          curl -s http://localhost:8080/health || true
          docker compose -f docker-compose.yml logs queuebox
          exit 1

      - name: Post a message to an inbox source
        # A new message must return 202, and the same message again must return 200.
        run: |
          body='{"id":"ci-compose-001","type":"payment.succeeded"}'
          first=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://localhost:8080/inbox/stripe -H 'Content-Type: application/json' -d "$body")
          second=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://localhost:8080/inbox/stripe -H 'Content-Type: application/json' -d "$body")
          echo "first=$first second=$second"
          test "$first" = "202"
          test "$second" = "200"

      - name: The message reaches the HTTP destination
        # Item 7 of section 11: the stack must DELIVER, not only accept. The `payment.*` route
        # sends the message to the `receiver` service.
        run: |
          for _ in $(seq 1 45); do
            if docker compose -f docker-compose.yml logs receiver 2>&1 | grep -q "ci-compose-001"; then
              docker compose -f docker-compose.yml logs receiver 2>&1 | grep "ci-compose-001" | head -1
              exit 0
            fi
            sleep 2
          done
          echo "the HTTP destination never received the message"
          docker compose -f docker-compose.yml logs receiver
          exit 1

      - name: The message reaches the RabbitMQ destination
        # The `event.**` route publishes to the topic exchange. QueueBox declares the exchange
        # lazily on the first publish, so this step declares it, a queue and a binding first.
        # The exchange arguments match the publisher, or the declare fails.
        run: |
          docker compose -f docker-compose.yml exec -T rabbitmq \
            rabbitmqadmin declare exchange name=queuebox-events type=topic durable=true
          docker compose -f docker-compose.yml exec -T rabbitmq \
            rabbitmqadmin declare queue name=ci-events durable=true
          docker compose -f docker-compose.yml exec -T rabbitmq \
            rabbitmqadmin declare binding source=queuebox-events destination=ci-events routing_key="event.#"
          curl -sf -X POST http://localhost:8080/inbox/stripe \
            -H 'Content-Type: application/json' \
            -d '{"id":"ci-compose-amqp","type":"event.payment.succeeded"}'
          for _ in $(seq 1 45); do
            depth=$(docker compose -f docker-compose.yml exec -T rabbitmq \
              rabbitmqctl list_queues name messages --no-table-headers 2>/dev/null \
              | awk '$1 == "ci-events" { print $2 }')
            if [ -n "${depth:-}" ] && [ "$depth" -ge 1 ]; then
              echo "the queue ci-events holds $depth message(s)"
              exit 0
            fi
            sleep 2
          done
          echo "the RabbitMQ destination never received the message"
          docker compose -f docker-compose.yml logs queuebox rabbitmq
          exit 1

      - name: Show the logs on a failure
        if: failure()
        run: docker compose -f docker-compose.yml logs

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml --profile rabbitmq down -v

  examples:
    name: Examples
    runs-on: ubuntu-latest
    # The `compose` job proves the HTTP and the RabbitMQ delivery path on every pull
    # request. Three more configurations are a nightly and main-branch concern.
    if: github.event_name != 'pull_request'
    # F-081: every example ships a smoke test, and the smoke test is the proof that the example
    # works. An example that nobody runs rots.
    strategy:
      fail-fast: false
      matrix:
        example: [webhook-receiver, http-fanout, rabbitmq-bridge, cdc]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run the smoke test
        run: ./examples/${{ matrix.example }}/smoke-test.sh

  manual-setup:
    name: Manual setup
    runs-on: ubuntu-latest
    # `DocumentedExamplesTest` guards the document on every pull request, and the steps
    # change rarely.
    if: github.event_name != 'pull_request'
    # F-075: the Manual Setup steps of docs/getting-started.md must work. This job runs them
    # verbatim. A change to that section that breaks a step fails this job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: queuebox
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Step 1, the database exists
        # The service container creates the database, which is step 1 of the document.
        run: PGPASSWORD=secret psql -h localhost -U postgres -d queuebox -c '\conninfo'

      - name: Step 2, write the configuration file
        run: |
          sudo mkdir -p /etc/queuebox
          sudo cp examples/queuebox.yml /etc/queuebox/queuebox.yml

      - name: Step 3 and step 4, set the variables and run
        run: |
          export QUEUEBOX_DATABASE_URL=jdbc:postgresql://localhost:5432/queuebox
          export QUEUEBOX_DATABASE_USERNAME=postgres
          export QUEUEBOX_DATABASE_PASSWORD=secret
          ./gradlew run --quiet > queuebox.log 2>&1 &
          echo $! > queuebox.pid

      - name: Step 5, confirm the instance is ready
        run: |
          for _ in $(seq 1 90); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || true)" = "200" ]; then
              curl -s http://localhost:8080/health
              exit 0
            fi
            sleep 2
          done
          echo "the instance never became ready"
          cat queuebox.log
          exit 1

      - name: Stop the instance
        if: always()
        run: kill "$(cat queuebox.pid)" || true
