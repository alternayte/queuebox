# The client libraries release on their own tags, never on the `v*` tag of the server.
#
# A client library and QueueBox itself do not share a cadence. A shared tag would force a whole
# server release for a one line library fix, and it would republish a library under a version
# whose number promises a change that the library did not make.
#
#   C#: `csharp-v0.1.1` publishes QueueBox.Inbox 0.1.1 to NuGet.
#   TypeScript: `typescript-v0.1.1` publishes @queuebox/inbox 0.1.1 to npm.
#   Go: `clients/go/v0.1.1` publishes the module. Go ties the tag of a module in a subdirectory
#   to that subdirectory, so this tag carries the path and cannot follow the pattern above.
name: release-clients

on:
  push:
    tags:
      - "csharp-v*"
      - "typescript-v*"
      - "clients/go/v*"

permissions:
  contents: read

jobs:
  csharp:
    name: Publish QueueBox.Inbox
    if: startsWith(github.ref_name, 'csharp-v')
    runs-on: ubuntu-latest
    permissions:
      # The job attaches the package to a GitHub release as well.
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # The 8.0 SDK brings the 8.0 runtime, so the tests run on the floor that the library
          # targets. The newer SDK reads the solution format.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Read the version from the tag
        id: version
        # `csharp-v0.1.1` becomes `0.1.1`. The tag must carry a version that NuGet accepts, so
        # the job stops here rather than publishing something unusable.
        run: |
          version="${GITHUB_REF_NAME#csharp-v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "The tag '${GITHUB_REF_NAME}' does not carry a version that NuGet accepts." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore clients/csharp/QueueBox.Inbox.slnx --locked-mode

      - name: Build
        run: dotnet build clients/csharp/QueueBox.Inbox.slnx -c Release --no-restore

      - name: Run the unit tests
        run: dotnet test clients/csharp/tests/QueueBox.Inbox.Tests -c Release --no-build

      - name: Run the contract tests against PostgreSQL and SQL Server
        # A push to NuGet cannot be undone, so the whole contract runs before it.
        run: dotnet test clients/csharp/tests/QueueBox.Inbox.IntegrationTests -c Release --no-build

      - name: Pack the version that the tag names
        run: |
          dotnet pack clients/csharp/src/QueueBox.Inbox \
            -c Release \
            -o artifacts \
            -p:Version=${{ steps.version.outputs.version }}

      - name: Push to NuGet
        # The key is a repository secret. Scope it to `QueueBox.*` and to push only.
        # `--skip-duplicate` makes a repeated tag a no-op rather than a failure.
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "${NUGET_API_KEY}" ]; then
            echo "The secret NUGET_API_KEY is not set. Add it before you tag a release." >&2
            exit 1
          fi
          dotnet nuget push "artifacts/QueueBox.Inbox.${{ steps.version.outputs.version }}.nupkg" \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "QueueBox.Inbox ${{ steps.version.outputs.version }}" \
            --notes "The C# pull inbox client library, version ${{ steps.version.outputs.version }}. See clients/csharp/README.md." \
            artifacts/*.nupkg

  typescript:
    name: Publish @queuebox/inbox
    if: startsWith(github.ref_name, 'typescript-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm trusted publishing signs the provenance with the workflow identity.
      id-token: write
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#typescript-v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "The tag '${GITHUB_REF_NAME}' does not carry a version that npm accepts." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run the unit tests
        run: npm test

      - name: Run the contract tests against PostgreSQL and SQL Server
        # A publish to npm cannot be undone after seventy two hours, so the whole contract runs
        # before it.
        run: npm run test:contract

      - name: Set the version that the tag names
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "The secret NPM_TOKEN is not set. Add it before you tag a release." >&2
            exit 1
          fi
          npm publish --access public --provenance

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "@queuebox/inbox ${{ steps.version.outputs.version }}" \
            --notes "The TypeScript pull inbox client library, version ${{ steps.version.outputs.version }}. See clients/typescript/README.md."

  go:
    name: Publish the Go module
    if: startsWith(github.ref_name, 'clients/go/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: clients/go/go.sum

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#clients/go/v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "The tag '${GITHUB_REF_NAME}' does not carry a version that Go accepts." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Vet and test the library
        working-directory: clients/go
        run: |
          go vet ./...
          go test -race ./...

      - name: Run the contract tests against PostgreSQL and SQL Server
        # A version that the module proxy has served cannot be withdrawn, so the whole contract
        # runs before the tag becomes a release.
        working-directory: clients/go/contract
        run: go test -timeout 30m ./...

      - name: Create the GitHub release
        # Go publishes nothing. The module proxy serves the tag straight from this repository, so
        # the tag IS the release. This step records it for a reader.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Go client ${{ steps.version.outputs.version }}" \
            --notes "The Go pull inbox client library, version ${{ steps.version.outputs.version }}.

          Install it with:

              go get github.com/alternayte/queuebox/clients/go@v${{ steps.version.outputs.version }}

          See clients/go/README.md."

      - name: Prove that the module proxy serves the version
        # The proxy fetches the tag on the first request, so this step is the evidence that a
        # consumer can install what the tag names.
        env:
          GOPROXY: https://proxy.golang.org
        run: |
          for attempt in 1 2 3 4 5 6; do
            if go list -m "github.com/alternayte/queuebox/clients/go@v${{ steps.version.outputs.version }}"; then
              exit 0
            fi

            echo "The proxy does not serve the version yet. Waiting." >&2
            sleep 20
          done

          echo "The module proxy did not serve the version." >&2
          exit 1
