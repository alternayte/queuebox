# F-043 and F-044: scan the dependencies and the container image, and publish an SBOM.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A new advisory can land against an unchanged dependency, so the scan also runs weekly.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: Dependency and image scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the software bill of materials
        # The CycloneDX plugin does not support the Gradle configuration cache.
        run: ./gradlew sbom --no-configuration-cache

      - name: Upload the software bill of materials
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: build/reports/queuebox-*-sbom.json
          if-no-files-found: error

      - name: Scan the dependencies
        # The scan reads the bill of materials that the previous step built. A source scan finds
        # no Java dependency, because the build uses a version catalog with no lock file.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: sbom
          scan-ref: build/reports/bom.json
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Build the container image
        run: docker build -t queuebox:scan .

      - name: Scan the container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: queuebox:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
