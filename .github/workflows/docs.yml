name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_CF_BEACON_TOKEN: ${{ secrets.CLOUDFLARE_BEACON_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # The doc tests (SQL, metric names, config samples) run in ci.yml with ./gradlew check.
      - name: Vale
        run: scripts/vale.sh

      - name: Build the site
        run: |
          cd site
          npm ci --no-audit --no-fund
          npx astro build

      # main deploys to queuebox-docs.pages.dev; a pull request gets a preview on its own alias.
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        id: deploy
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          url=$(npx --yes wrangler@4 pages deploy site/dist --project-name=queuebox-docs --branch="$branch" | grep -oE 'https://[^ ]+\.pages\.dev' | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment "$PR" --body "Docs preview - $URL" --edit-last || gh pr comment "$PR" --body "Docs preview - $URL"

      - name: Deploy skipped
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the site was built but not deployed."
