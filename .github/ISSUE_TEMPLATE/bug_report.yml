name: Bug report
description: Report a defect in QueueBox.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Do not report a security vulnerability here.
        Use the private channel in [SECURITY.md](https://github.com/AlterNayte/queuebox/blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the defect in two or three sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List each step. Start every step with a command verb.
      placeholder: |
        1. Start QueueBox with the configuration below.
        2. Post a message to the inbox route.
        3. Read the outbox table.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the log lines. Remove every credential first.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: QueueBox version
      description: The image tag or the commit hash.
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - PostgreSQL
        - SQL Server
        - Not relevant
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: The operating system, the Java version, and the deployment method.
      placeholder: Ubuntu 24.04, Java 21, Docker Compose
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Configuration
      description: The smallest configuration that reproduces the defect. Remove every credential.
      render: yaml
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and found no duplicate.
          required: true
        - label: I removed every credential from the report.
          required: true
