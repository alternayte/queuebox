# The release check of docs/development/releasing.md.
#
# It overrides the shipped stack so the released image runs instead of a local build. Use it with
# the base file:
#
#   RELEASE_IMAGE=ghcr.io/alternayte/queuebox:0.1.0 \
#     docker compose -f docker-compose.yml -f docker-compose.release.yml up -d
#
# QueueBox needs a database, so the image cannot be checked alone. It exits when no database
# answers within `database.startupTimeoutMs`.
services:
  queuebox:
    image: ${RELEASE_IMAGE:?set RELEASE_IMAGE to the released tag}
    build: !reset null
