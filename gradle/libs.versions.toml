# Version catalog is a central place for you to declare and version dependencies
# https://docs.gradle.org/current/userguide/platforms.html#sub:version-catalog
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
kotlin = "2.3.0"
kotlinxDatetime = "0.6.1"
kotlinxSerializationJSON = "1.7.3"
kotlinxCoroutines = "1.9.0"
ktor = "3.4.0"
hoplite = "2.9.0"
micrometer = "1.15.12"
jsonata = "0.9.8"
flyway = "11.1.0"
cyclonedx = "1.10.0"
slf4j = "2.0.16"
logback = "1.5.12"
logstashEncoder = "8.0"
hikari = "7.1.0"
exposed = "0.56.0"
postgresql = "42.7.12"
mssqlJdbc = "12.8.2.jre11"
amqpClient = "5.33.1"
jsonPath = "2.9.0"
ktlint = "12.1.2"
# The ktlint engine, which is separate from the version of the Gradle plugin.
ktlintEngine = "1.5.0"
detekt = "1.23.8"
# 0.8.13 filters the synthetic classes that the Kotlin coroutine compiler generates.
jacoco = "0.8.13"

# Security floors. Each version below is the lowest release that carries no HIGH or CRITICAL
# advisory for the artifact, as the `security` workflow reports it. They reach the build as
# dependency constraints, not as dependencies, so a floor raises a transitive version and adds
# nothing to the class path. Raise a floor when the scan reports a newer advisory; never lower one.
# Most of these arrive through the embedded capture connector, which brings the Kafka Connect
# runtime with it.
jacksonFloor = "2.21.4"
nettyFloor = "4.2.16.Final"
kafkaFloor = "4.1.2"
jettyFloor = "12.0.36"
jsonSmartFloor = "2.5.2"
lz4Floor = "1.8.1"
plexusUtilsFloor = "3.6.1"

# Testing
testcontainers = "1.20.4"
mockk = "1.13.13"

[libraries]
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinxDatetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinxSerialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJSON" }
kotlinxCoroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }

# Ktor Server
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { group = "io.ktor", name = "ktor-server-netty", version.ref = "ktor" }
ktor-serialization-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor"}
ktor-content-negotiation = {group = "io.ktor", name = "ktor-server-content-negotiation", version.ref="ktor"}
ktor-server-rate-limit = { group = "io.ktor", name = "ktor-server-rate-limit", version.ref = "ktor" }

# Ktor Client
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }

# Hoplite
hoplite-core = {group = "com.sksamuel.hoplite", name = "hoplite-core", version.ref = "hoplite"}
hoplite-yaml = {group = "com.sksamuel.hoplite", name = "hoplite-yaml", version.ref = "hoplite"}

# Micrometer
micrometer-core = { group = "io.micrometer", name = "micrometer-core", version.ref = "micrometer" }
micrometer-prometheus = { group = "io.micrometer", name = "micrometer-registry-prometheus", version.ref = "micrometer" }

# JSONata
jsonata = { group = "com.dashjoin", name = "jsonata", version.ref = "jsonata" }

# Logging
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
kotlinx-coroutines-slf4j = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-slf4j", version.ref = "kotlinxCoroutines" }
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
logstash-encoder = { group = "net.logstash.logback", name = "logstash-logback-encoder", version.ref = "logstashEncoder" }

# Flyway
flyway-core = { group = "org.flywaydb", name = "flyway-core", version.ref = "flyway" }
flyway-postgresql = { group = "org.flywaydb", name = "flyway-database-postgresql", version.ref = "flyway" }
flyway-sqlserver = { group = "org.flywaydb", name = "flyway-sqlserver", version.ref = "flyway" }

# Database drivers and pooling
hikaricp = { group = "com.zaxxer", name = "HikariCP", version.ref = "hikari" }
postgresql = { group = "org.postgresql", name = "postgresql", version.ref = "postgresql" }
mssql-jdbc = { group = "com.microsoft.sqlserver", name = "mssql-jdbc", version.ref = "mssqlJdbc" }

# Exposed
exposed-core = { group = "org.jetbrains.exposed", name = "exposed-core", version.ref = "exposed" }
exposed-jdbc = { group = "org.jetbrains.exposed", name = "exposed-jdbc", version.ref = "exposed" }
exposed-json = { group = "org.jetbrains.exposed", name = "exposed-json", version.ref = "exposed" }
exposed-kotlin-datetime = { group = "org.jetbrains.exposed", name = "exposed-kotlin-datetime", version.ref = "exposed" }

# RabbitMQ
amqp-client = { group = "com.rabbitmq", name = "amqp-client", version.ref = "amqpClient" }

# Lint plugins, resolved by the convention plugin in buildSrc
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint" }
detekt-gradle-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }

# JSONPath
json-path = { group = "com.jayway.jsonpath", name = "json-path", version.ref = "jsonPath" }

# Testing
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
ktor-server-test-host = { group = "io.ktor", name = "ktor-server-test-host", version.ref = "ktor" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
testcontainers-core = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-rabbitmq = { module = "org.testcontainers:rabbitmq", version.ref = "testcontainers" }
testcontainers-mssqlserver = { module = "org.testcontainers:mssqlserver", version.ref = "testcontainers" }

# Libraries can be bundled together for easier import
[bundles]
kotlinxEcosystem = ["kotlinxDatetime", "kotlinxSerialization", "kotlinxCoroutines"]
ktorServerEcosystem = ["ktor-server-core","ktor-server-netty","ktor-serialization-json","ktor-content-negotiation"]
ktorClientEcosystem = ["ktor-client-core", "ktor-client-cio", "ktor-client-content-negotiation", "ktor-serialization-json"]
hopliteEcosystem = ["hoplite-core","hoplite-yaml"]
exposedEcosystem = ["exposed-core", "exposed-jdbc", "exposed-json", "exposed-kotlin-datetime"]

# Test bundles
testCore = ["kotlin-test", "mockk"]
testCoroutines = ["kotlinx-coroutines-test"]
testKtorServer = ["ktor-server-test-host"]
testKtorClient = ["ktor-client-mock"]
testContainersCore = ["testcontainers-core", "testcontainers-junit"]
testContainersPostgresql = ["testcontainers-postgresql", "testcontainers-junit"]
testContainersRabbitmq = ["testcontainers-rabbitmq", "testcontainers-junit"]
testContainersMssqlserver = ["testcontainers-mssqlserver", "testcontainers-junit"]

[plugins]
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
kotlinPluginSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
